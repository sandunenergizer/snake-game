<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root{--bg1:#1b1145;--bg2:#0b3b5c;--panel:#2a1f66;--text:#f4f1ff;--accent:#ffd93d;--accent2:#ff5fa2;--btn-text:#25134d;--border:#7b5cff}
  body.hc{--bg1:#000;--bg2:#000;--panel:#000;--text:#fff;--accent:#ffff00;--accent2:#fff;--btn-text:#000;--border:#fff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;
       background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif;touch-action:manipulation}
  h1{margin:0;font-size:2rem;letter-spacing:.05em;background:linear-gradient(90deg,#ff5fa2,#ffd93d,#4be3a1,#4fc3ff,#b388ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  body.hc h1{background:none;color:#fff}
  .hud{display:flex;gap:22px;font-size:1.05rem;flex-wrap:wrap;justify-content:center}
  .hud b{color:var(--accent)}
  .wrap{position:relative;width:min(92vw,480px)}
  canvas{width:100%;height:auto;display:block;border:4px solid var(--border);border-radius:12px;touch-action:none;box-shadow:0 0 28px rgba(123,92,255,.45)}
  body.hc canvas{box-shadow:none;border-width:5px}
  #msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
       background:rgba(14,8,40,.88);border-radius:10px;text-align:center;padding:1rem;transition:opacity .25s}
  body.hc #msg{background:#000}
  #msg.hide{opacity:0;pointer-events:none}
  button{font:inherit;font-weight:700;padding:.55rem 1.3rem;border:2px solid transparent;border-radius:10px;background:var(--accent);color:var(--btn-text);cursor:pointer;transition:transform .12s,background .2s}
  button:hover{transform:scale(1.06)}
  button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
  .levels{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .levels button{background:transparent;color:var(--text);border-color:var(--border)}
  .levels button[aria-pressed="true"]{background:var(--accent2);color:var(--btn-text);border-color:var(--accent2)}
  body.hc .levels button[aria-pressed="true"]{background:#fff;color:#000;text-decoration:underline}
  .pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,54px);gap:8px}
  .pad button{padding:0;background:var(--panel);color:var(--text);font-size:1.4rem;border-color:var(--border)}
  .pad .up{grid-column:2}.pad .left{grid-row:2;grid-column:1}.pad .down{grid-row:2;grid-column:2}.pad .right{grid-row:2;grid-column:3}
  .opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  .opts button{background:transparent;color:var(--text);border-color:var(--border);padding:.4rem 1rem}
  .opts button[aria-pressed="true"]{background:var(--accent);color:var(--btn-text)}
  small{opacity:.8}
</style>
</head>
<body>
  <h1>Snake</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Level: <b id="lvl">Normal</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <div class="wrap">
    <canvas id="c" width="400" height="400" aria-label="Snake game board"></canvas>
    <div id="msg">
      <h2 id="title" style="margin:0">Ready?</h2>
      <p id="sub" style="margin:0">Arrow keys, WASD or swipe to steer.</p>
      <div class="levels" role="group" aria-label="Difficulty">
        <button data-l="easy" aria-pressed="false">Easy</button>
        <button data-l="normal" aria-pressed="true">Normal</button>
        <button data-l="hard" aria-pressed="false">Hard</button>
      </div>
      <small id="desc"></small>
      <button id="go">Start game</button>
    </div>
  </div>
  <div class="pad" aria-label="On-screen controls">
    <button class="up" data-d="up" aria-label="Up">&#9650;</button>
    <button class="left" data-d="left" aria-label="Left">&#9664;</button>
    <button class="down" data-d="down" aria-label="Down">&#9660;</button>
    <button class="right" data-d="right" aria-label="Right">&#9654;</button>
  </div>
  <div class="opts">
    <button id="hcBtn" aria-pressed="false">High contrast: off</button>
    <small>Space = pause &nbsp;|&nbsp; H = high contrast</small>
  </div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 20, S = cv.width / N;
const DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
const LEVELS = {
  easy:   {name:'Easy',   speed:180, min:110, step:8,  every:5, wrap:true,  rocks:0, desc:'Slow snake. Walls wrap around.'},
  normal: {name:'Normal', speed:140, min:70,  step:10, every:4, wrap:false, rocks:0, desc:'Walls are deadly. Speeds up as you grow.'},
  hard:   {name:'Hard',   speed:105, min:45,  step:10, every:3, wrap:false, rocks:7, desc:'Fast, deadly walls and rocks in the way.'}
};
const FRUITS = ['#ff4d6d','#ffb703','#ff7b00','#c77dff','#4cc9f0'];
let level = 'normal', hc = false;
let snake, dir, nextDir, food, rocks, score, timer, running = false, paused = false, speed, fruitColor, best = {};

function load(){ try {
  best = JSON.parse(localStorage.getItem('snakeBest2') || '{}');
  level = localStorage.getItem('snakeLevel') || 'normal';
  hc = localStorage.getItem('snakeHC') === '1';
} catch(e) {} if (!LEVELS[level]) level = 'normal'; }
function save(){ try {
  localStorage.setItem('snakeBest2', JSON.stringify(best));
  localStorage.setItem('snakeLevel', level);
  localStorage.setItem('snakeHC', hc ? '1' : '0');
} catch(e) {} }

function applyUI(){
  document.body.classList.toggle('hc', hc);
  const hb = document.getElementById('hcBtn');
  hb.setAttribute('aria-pressed', hc); hb.textContent = 'High contrast: ' + (hc ? 'on' : 'off');
  document.querySelectorAll('.levels button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === level));
  document.getElementById('lvl').textContent = LEVELS[level].name;
  document.getElementById('desc').textContent = LEVELS[level].desc;
  document.getElementById('best').textContent = best[level] || 0;
  if (snake) draw();
}
function free(x, y){ return !snake.some(s => s.x === x && s.y === y) && !rocks.some(r => r.x === x && r.y === y) && !(food && food.x === x && food.y === y); }
function reset(){
  const L = LEVELS[level];
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = 'right'; score = 0; speed = L.speed; rocks = []; food = null;
  document.getElementById('score').textContent = 0;
  while (rocks.length < L.rocks){
    const x = Math.floor(Math.random()*N), y = Math.floor(Math.random()*N);
    if (Math.abs(y - 10) > 1 && free(x, y)) rocks.push({x, y});     // keep the start row clear
  }
  placeFood();
}
function placeFood(){
  let x, y;
  do { x = Math.floor(Math.random()*N); y = Math.floor(Math.random()*N); } while (!free(x, y));
  food = {x, y}; fruitColor = FRUITS[Math.floor(Math.random()*FRUITS.length)];
}
function start(){
  reset(); running = true; paused = false;
  document.getElementById('msg').classList.add('hide');
  clearInterval(timer); timer = setInterval(tick, speed); draw();
}
function setDir(d){
  const c = DIRS[dir], n = DIRS[d];
  if (c[0] + n[0] !== 0 || c[1] + n[1] !== 0) nextDir = d;
}
function tick(){
  if (paused) return;
  const L = LEVELS[level];
  dir = nextDir;
  let hx = snake[0].x + DIRS[dir][0], hy = snake[0].y + DIRS[dir][1];
  if (L.wrap){ hx = (hx + N) % N; hy = (hy + N) % N; }
  else if (hx < 0 || hy < 0 || hx >= N || hy >= N) return gameOver();
  if (snake.some(s => s.x === hx && s.y === hy) || rocks.some(r => r.x === hx && r.y === hy)) return gameOver();
  snake.unshift({x:hx, y:hy});
  if (hx === food.x && hy === food.y){
    score++; document.getElementById('score').textContent = score;
    if (speed > L.min && score % L.every === 0){ speed = Math.max(L.min, speed - L.step); clearInterval(timer); timer = setInterval(tick, speed); }
    placeFood();
  } else snake.pop();
  draw();
}
function gameOver(){
  clearInterval(timer); running = false;
  if (score > (best[level] || 0)){ best[level] = score; document.getElementById('best').textContent = score; save(); }
  document.getElementById('title').textContent = 'Game over';
  document.getElementById('sub').textContent = 'You scored ' + score + ' on ' + LEVELS[level].name + '.';
  document.getElementById('go').textContent = 'Play again';
  document.getElementById('msg').classList.remove('hide');
}

function draw(){
  // board
  if (hc){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height); }
  else {
    const g = ctx.createLinearGradient(0, 0, cv.width, cv.height);
    g.addColorStop(0, '#1d2b64'); g.addColorStop(1, '#123a52');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
      if ((x + y) % 2) { ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(x*S, y*S, S, S); }
  }
  // rocks
  rocks.forEach(r => {
    ctx.fillStyle = hc ? '#fff' : '#8d6e63';
    ctx.strokeStyle = hc ? '#000' : '#4e342e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(r.x*S + 2, r.y*S + 2, S - 4, S - 4, 4); ctx.fill(); ctx.stroke();
    if (hc){ ctx.beginPath(); ctx.moveTo(r.x*S + 4, r.y*S + 4); ctx.lineTo(r.x*S + S - 4, r.y*S + S - 4);
             ctx.moveTo(r.x*S + S - 4, r.y*S + 4); ctx.lineTo(r.x*S + 4, r.y*S + S - 4); ctx.stroke(); }
  });
  // food (diamond in high contrast so shape, not color, identifies it)
  const fx = food.x*S + S/2, fy = food.y*S + S/2;
  ctx.save();
  if (hc){
    ctx.fillStyle = '#ffff00'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(fx, fy - S/2 + 2); ctx.lineTo(fx + S/2 - 2, fy); ctx.lineTo(fx, fy + S/2 - 2); ctx.lineTo(fx - S/2 + 2, fy); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.shadowColor = fruitColor; ctx.shadowBlur = 16; ctx.fillStyle = fruitColor;
    ctx.beginPath(); ctx.arc(fx, fy, S/2 - 3, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(fx - 3, fy - 3, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  // snake
  for (let i = snake.length - 1; i >= 0; i--){
    const s = snake[i], head = i === 0;
    if (hc){ ctx.fillStyle = head ? '#00ffff' : '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; }
    else { ctx.fillStyle = head ? '#ffffff' : 'hsl(' + ((i * 16 + score * 9) % 360) + ',85%,58%)'; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; }
    ctx.beginPath(); ctx.roundRect(s.x*S + 1, s.y*S + 1, S - 2, S - 2, head ? 8 : 5); ctx.fill(); ctx.stroke();
    if (head){                                    // eyes
      const d = DIRS[dir], px = -d[1], py = d[0], cx = s.x*S + S/2 + d[0]*3, cy = s.y*S + S/2 + d[1]*3;
      ctx.fillStyle = '#000';
      [-1, 1].forEach(k => { ctx.beginPath(); ctx.arc(cx + px*k*4, cy + py*k*4, 2.2, 0, Math.PI*2); ctx.fill(); });
    }
  }
}

document.getElementById('go').onclick = start;
document.querySelectorAll('.levels button').forEach(b => b.onclick = () => { level = b.dataset.l; save(); applyUI(); });
document.getElementById('hcBtn').onclick = () => { hc = !hc; save(); applyUI(); };
document.querySelectorAll('.pad button').forEach(b => b.onclick = () => running && setDir(b.dataset.d));
addEventListener('keydown', e => {
  const map = {ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
  if (map[e.key]){ e.preventDefault(); if (running) setDir(map[e.key]); }
  else if (e.key === ' ' && running){ e.preventDefault(); paused = !paused; }
  else if (e.key === 'h' || e.key === 'H'){ hc = !hc; save(); applyUI(); }
  else if (e.key === 'Enter' && !running && document.activeElement.tagName !== 'BUTTON') start();
});
let t0;
cv.addEventListener('touchstart', e => { t0 = e.touches[0]; }, {passive:true});
cv.addEventListener('touchend', e => {
  if (!t0 || !running) return;
  const dx = e.changedTouches[0].clientX - t0.clientX, dy = e.changedTouches[0].clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
load(); reset(); applyUI();
</script>
</body>
</html>
